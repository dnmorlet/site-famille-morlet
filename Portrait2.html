var mes="Fonction désactivée !";
function click(e) {
if (document.all) {
if (event.button == 2) {
alert(mes);
return false;
}
}
if (document.layers) {
if (e.which == 3) {
alert(mes);
return false;
}
}
}
if (document.layers) {
document.captureEvents(Event.MOUSEDOWN);
}
document.onmousedown=click;
</script>
